digraph Calcular_f_x {
  Inicio [
    shape=ellipse,
    label="Inicio", 
    fillcolor="#FF0000", 
    style="filled"
  ];
  Leer_X [
    shape=parallelogram,
    label="Leer X"
  ];
  Condicion_0 [
    shape=diamond,
    label="¿X mod 4 = 0?"
  ];
  Condicion_1 [
    shape=diamond,
    label="¿X mod 4 = 1?"
  ];
  Condicion_2 [
    shape=diamond,
    label="¿X mod 4 = 2?"
  ];
  Condicion_3 [
    shape=diamond,
    label="¿X mod 4 = 3?"
  ];
  Calcular_0 [
    shape=box,
    label="Calcular x^2"
  ];
  Calcular_1 [
    shape=box,
    label="Calcular x/6"
  ];
  Calcular_2 [
    shape=box,
    label="Calcular √x"
  ];
  Calcular_3 [
    shape=box,
    label="Calcular x^3+5"
  ];
  Imprimir_Resultado [
    shape=box,
    label="Imprimir f(x)"
  ];
  Fin [
    shape=ellipse,
    label="Fin"
  ];

  Inicio -> Leer_X;
  Leer_X -> Condicion_0;

  Condicion_0 -> Condicion_1 [label="No"];
  Condicion_0 -> Calcular_0 [label="Sí"];

  Condicion_1 -> Condicion_2 [label="No"];
  Condicion_1 -> Calcular_1 [label="Sí"];

  Condicion_2 -> Condicion_3 [label="No"];
  Condicion_2 -> Calcular_2 [label="Sí"];

  Condicion_3 -> Calcular_3 [label="Sí"];
  Condicion_3 -> Fin [label="No"];

  Calcular_0 -> Imprimir_Resultado;
  Calcular_1 -> Imprimir_Resultado;
  Calcular_2 -> Imprimir_Resultado;
  Calcular_3 -> Imprimir_Resultado;
  Imprimir_Resultado -> Fin;
}
