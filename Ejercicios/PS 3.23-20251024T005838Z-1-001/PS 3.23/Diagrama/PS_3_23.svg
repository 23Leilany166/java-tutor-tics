digraph Calcular_Promedio {
  Inicio [
    shape=ellipse,
    label="Inicio", 
    fillcolor="#FF0000", 
    style="filled"
  ];
  Leer_Matricula [
    shape=parallelogram,
    label="Leer MATi"
  ];
  Leer_Calificaciones [
    shape=parallelogram,
    label="Leer CALi,1, CALi,2, ..., CALi,5"
  ];
  Calcular_Promedio [
    shape=diamond,
    label="¿i <= 35?"
  ];
  Imprimir_Resultado [
    shape=box,
    label="Imprimir MATi, Promedio"
  ];
  Fin [
    shape=ellipse,
    label="Fin"
  ];

  Inicio -> Leer_Matricula;
  Leer_Matricula -> Leer_Calificaciones;
  Leer_Calificaciones -> Calcular_Promedio;
  Calcular_Promedio -> Imprimir_Resultado [label="Sí"];
  Calcular_Promedio -> Fin [label="No"];
  Imprimir_Resultado -> Leer_Matricula;
}
