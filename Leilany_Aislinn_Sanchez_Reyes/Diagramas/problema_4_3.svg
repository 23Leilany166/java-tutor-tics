<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1250" viewBox="0 0 1100 1600">
  <defs>
    <style>
      .label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill:#0d1b2a; }
      .term { fill:#fff8e6; stroke:#f4a261; stroke-width:2; }
      .process { fill:#f0fff4; stroke:#2a9d8f; stroke-width:2; rx:10; ry:10; }
      .io { fill:#e6f2ff; stroke:#2563eb; stroke-width:2; }
      .decision { fill:#fff; stroke:#9333ea; stroke-width:2; }
      .arrow { stroke:#000; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 10,4 0,8" fill="#000"/>
    </marker>
  </defs>
  <rect width="1100" height="1600" fill="#fafafa"/>
  <text x="550" y="40" text-anchor="middle" font-size="18" font-weight="bold">Diagrama de Flujo 4.11 – Conteo y Ganador de Votos</text>

  <ellipse class="term" cx="550" cy="90" rx="80" ry="26"/>
  <text x="550" y="95" text-anchor="middle" class="label">INICIO</text>

  <rect class="process" x="480" y="150" width="130" height="40"/>
  <text x="545" y="178" text-anchor="middle" class="label">I ← 1</text>

  <polygon class="decision" points="550,215 640,265 550,315 460,265"/>
  <text x="550" y="273" text-anchor="middle" class="label">¿I ≤ 12?</text>

  <rect class="process" x="460" y="340" width="180" height="40"/>
  <text x="550" y="368" text-anchor="middle" class="label">VOTOS[I] ← 0</text>

  <rect class="process" x="480" y="410" width="130" height="40"/>
  <text x="545" y="438" text-anchor="middle" class="label">I ← I + 1</text>

  <polygon class="io" points="450,480 650,480 620,530 420,530"/>
  <text x="550" y="515" text-anchor="middle" class="label">"Ingrese el primer voto"</text>

  <polygon class="io" points="450,560 650,560 620,610 420,610"/>
  <text x="550" y="595" text-anchor="middle" class="label">CANDIDATO</text>

  <polygon class="decision" points="550,650 660,700 550,750 440,700"/>
  <text x="550" y="707" text-anchor="middle" class="label">¿CANDIDATO ≠ -1?</text>

  <rect class="process" x="360" y="780" width="380" height="40"/>
  <text x="550" y="808" text-anchor="middle" class="label">VOTOS[CANDIDATO] ← VOTOS[CANDIDATO] + 1</text>

  <polygon class="io" points="450,850 650,850 620,900 420,900"/>
  <text x="550" y="885" text-anchor="middle" class="label">"Siguiente voto"</text>

  <polygon class="io" points="450,930 650,930 620,980 420,980"/>
  <text x="550" y="965" text-anchor="middle" class="label">CANDIDATO</text>

  <polygon class="io" points="400,1020 700,1020 670,1070 370,1070"/>
  <text x="550" y="1055" text-anchor="middle" class="label">"Total de votos por candidato"</text>

  <rect class="process" x="480" y="1090" width="130" height="40"/>
  <text x="545" y="1118" text-anchor="middle" class="label">I ← 1</text>

  <polygon class="decision" points="550,1160 640,1210 550,1260 460,1210"/>
  <text x="550" y="1217" text-anchor="middle" class="label">¿I ≤ 12?</text>

  <polygon class="io" points="380,1300 720,1300 750,1350 410,1350"/>
  <text x="565" y="1335" text-anchor="middle" class="label">"Candidato", I, "total votos", VOTOS[I]</text>

  <rect class="process" x="480" y="1380" width="130" height="40"/>
  <text x="545" y="1408" text-anchor="middle" class="label">I ← I + 1</text>

  <ellipse class="term" cx="550" cy="1470" rx="80" ry="26"/>
  <text x="550" y="1475" text-anchor="middle" class="label">FIN</text>

  <!-- Flechas -->
  <path class="arrow" d="M 550 116 L 550 150"/>
  <path class="arrow" d="M 550 190 L 550 215"/>
  <path class="arrow" d="M 550 315 L 550 340"/>
  <path class="arrow" d="M 550 380 L 550 410"/>
  <path class="arrow" d="M 550 450 L 550 480"/>
  <path class="arrow" d="M 550 530 L 550 560"/>
  <path class="arrow" d="M 550 610 L 550 650"/>
  <path class="arrow" d="M 550 750 L 550 780"/>
  <path class="arrow" d="M 550 820 L 550 850"/>
  <path class="arrow" d="M 550 900 L 550 930"/>
  <path class="arrow" d="M 550 980 L 550 1020"/>
  <path class="arrow" d="M 550 1070 L 550 1090"/>
  <path class="arrow" d="M 550 1130 L 550 1160"/>
  <path class="arrow" d="M 550 1260 L 550 1300"/>
  <path class="arrow" d="M 550 1350 L 550 1380"/>
  <path class="arrow" d="M 550 1420 L 550 1470"/>
</svg>
