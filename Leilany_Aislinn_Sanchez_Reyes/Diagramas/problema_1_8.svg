<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720">
  <defs>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill:#0d1b2a; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill:#0d1b2a; }
      .small { font: 15px 'Segoe UI', Arial, sans-serif; fill:#415a77; }
      .io { fill:#e6f2ff; stroke:#2c7be5; stroke-width:2.5; }
      .process { fill:#f7fff2; stroke:#2a9d8f; stroke-width:2.5; rx:8; ry:8; }
      .terminator { fill:#fff8e6; stroke:#f4a261; stroke-width:2.5; }
      .arrow { stroke:#1f2937; stroke-width:2.5; fill:none; marker-end:url(#arrowhead); }
      .note { fill:#ffffff; }
      .note-border { stroke:#94a3b8; stroke-width:1.5; fill:none; stroke-dasharray:4 4; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#1f2937" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="720" fill="#fafafa"/>

  <text x="320" y="60" class="title">Diagrama de flujo – Distancia entre dos puntos</text>
  <text x="320" y="88" class="small">DIS = √((X1 − X2)² + (Y1 − Y2)²)</text>

  <!-- START -->
  <ellipse class="terminator" cx="320" cy="130" rx="110" ry="35"/>
  <text x="320" y="135" text-anchor="middle" class="label">INICIO</text>

  <line class="arrow" x1="320" y1="165" x2="320" y2="210"/>

  <!-- Input -->
  <polygon class="io" points="240,210 430,210 400,260 210,260"/>
  <text x="320" y="242" text-anchor="middle" class="label">X1, Y1, X2, Y2</text>

  <line class="arrow" x1="320" y1="260" x2="320" y2="330"/>

  <!-- Process with math superscripts -->
  <rect class="process" x="120" y="330" width="400" height="90" rx="10" ry="10"/>
  <text x="140" y="375" class="label">
    <tspan>DIS ← √((X1 − X2)</tspan>
    <tspan baseline-shift="super" font-size="75%">2</tspan>
    <tspan> + (Y1 − Y2)</tspan>
    <tspan baseline-shift="super" font-size="75%">2</tspan>
    <tspan>)</tspan>
  </text>

  <line class="arrow" x1="320" y1="420" x2="320" y2="480"/>

  <!-- Output -->
  <polygon class="io" points="210,480 400,480 430,530 240,530"/>
  <text x="320" y="512" text-anchor="middle" class="label">DIS</text>

  <line class="arrow" x1="320" y1="530" x2="320" y2="585"/>

  <!-- END -->
  <ellipse class="terminator" cx="320" cy="625" rx="110" ry="35"/>
  <text x="320" y="630" text-anchor="middle" class="label">FIN</text>

  <!-- Right notes -->
  <g>
    <rect x="560" y="210" width="320" height="56" class="note"/>
    <rect x="560" y="210" width="320" height="56" class="note-border"/>
    <text x="575" y="245" class="small">{Lectura de datos}</text>

    <rect x="560" y="330" width="320" height="96" class="note"/>
    <rect x="560" y="330" width="320" height="96" class="note-border"/>
    <text x="575" y="360" class="small">Se calcula la distancia euclidiana:</text>
    <text x="575" y="382" class="small">DIS = √((X1 − X2)² + (Y1 − Y2)²)</text>

    <rect x="560" y="480" width="320" height="56" class="note"/>
    <rect x="560" y="480" width="320" height="56" class="note-border"/>
    <text x="575" y="515" class="small">{Escritura de DIS con el resultado}</text>
  </g>

  <!-- Footer -->
  <text x="40" y="695" class="small">Diagrama de Flujo 1.15</text>
</svg>
