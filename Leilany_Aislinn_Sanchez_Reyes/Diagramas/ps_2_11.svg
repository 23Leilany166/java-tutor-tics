<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550">
  <style>
    .term { fill:#fff8e6; stroke:#f4a261; stroke-width:2; }
    .proc { fill:#e7fff3; stroke:#2a9d8f; stroke-width:2; rx:8; ry:8; }
    .io { fill:#e6f2ff; stroke:#2563eb; stroke-width:2; }
    .dec { fill:#fff; stroke:#9333ea; stroke-width:2; }
    .label { font:600 12px 'Segoe UI', Arial, sans-serif; fill:#0d1b2a; text-anchor:middle; }
    .arrow { stroke:#000; stroke-width:1.5; fill:none; marker-end:url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#000"/>
    </marker>
  </defs>

  <rect width="400" height="550" fill="#fafafa"/>
  <text x="200" y="25" text-anchor="middle" style="font:700 14px Arial;">PS 2.11 – X según Y</text>

  <!-- Inicio -->
  <ellipse class="term" cx="200" cy="50" rx="50" ry="15"/>
  <text x="200" y="54" class="label">INICIO</text>

  <!-- Leer Y -->
  <polygon class="io" points="140,75 260,75 240,105 120,105"/>
  <text x="190" y="95" class="label">Leer Y</text>

  <!-- ¿Y ≤ 0? -->
  <polygon class="dec" points="200,115 255,145 200,175 145,145"/>
  <text x="200" y="150" class="label">¿Y ≤ 0?</text>
  <rect class="proc" x="50" y="185" width="90" height="25"/>
  <text x="95" y="202" class="label">X = 0</text>

  <!-- ¿Y ≤ 11? -->
  <polygon class="dec" points="200,185 255,215 200,245 145,215"/>
  <text x="200" y="220" class="label">¿Y ≤ 11?</text>
  <rect class="proc" x="50" y="260" width="110" height="25"/>
  <text x="105" y="277" class="label">X = 3Y + 36</text>

  <!-- ¿Y ≤ 33? -->
  <polygon class="dec" points="200,260 255,290 200,320 145,290"/>
  <text x="200" y="295" class="label">¿Y ≤ 33?</text>
  <rect class="proc" x="50" y="335" width="110" height="25"/>
  <text x="105" y="352" class="label">X = Y² - 10</text>

  <!-- ¿Y ≤ 64? -->
  <polygon class="dec" points="200,335 255,365 200,395 145,365"/>
  <text x="200" y="370" class="label">¿Y ≤ 64?</text>
  <rect class="proc" x="50" y="410" width="130" height="25"/>
  <text x="115" y="427" class="label">X = Y³ + Y² - 1</text>
  <rect class="proc" x="260" y="380" width="90" height="25"/>
  <text x="305" y="397" class="label">X = 0</text>

  <!-- Mostrar -->
  <polygon class="io" points="150,445 250,445 235,475 135,475"/>
  <text x="195" y="465" class="label">Mostrar X, Y</text>

  <!-- Fin -->
  <ellipse class="term" cx="195" cy="510" rx="50" ry="15"/>
  <text x="195" y="514" class="label">FIN</text>

  <!-- Flechas limpias -->
  <path class="arrow" d="M200 65 L200 75"/>
  <path class="arrow" d="M200 105 L200 115"/>
  <path class="arrow" d="M145 145 C110 155 100 165 95 185"/>
  <path class="arrow" d="M200 175 L200 185"/>
  <path class="arrow" d="M145 215 C115 225 105 235 105 260"/>
  <path class="arrow" d="M200 245 L200 260"/>
  <path class="arrow" d="M145 290 C115 300 105 310 105 335"/>
  <path class="arrow" d="M200 320 L200 335"/>
  <path class="arrow" d="M145 365 C110 370 100 390 100 410"/>
  <path class="arrow" d="M305 405 C305 420 250 440 230 445"/>
  <path class="arrow" d="M200 395 L200 445"/>
  <path class="arrow" d="M195 475 L195 495"/>
</svg>
