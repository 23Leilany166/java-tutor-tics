<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill:#0d1b2a; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill:#0d1b2a; }
      .small { font: 15px 'Segoe UI', Arial, sans-serif; fill:#415a77; }
      .io { fill:#e6f2ff; stroke:#2c7be5; stroke-width:2.5; }
      .process { fill:#f7fff2; stroke:#2a9d8f; stroke-width:2.5; rx:10; ry:10; }
      .terminator { fill:#fff8e6; stroke:#f4a261; stroke-width:2.5; }
      .decision { fill:#fff; stroke:#7c3aed; stroke-width:2.5; }
      .arrow { stroke:#1f2937; stroke-width:2.5; fill:none; marker-end:url(#arrowhead); }
      .note { fill:#ffffff; }
      .note-border { stroke:#94a3b8; stroke-width:1.5; fill:none; stroke-dasharray:4 4; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 12,4 0,8" fill="#1f2937" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="800" fill="#fafafa"/>

  <text x="400" y="48" class="title">Diagrama de flujo – Raíces de ax² + bx + c (reales)</text>
  <text x="400" y="74" class="small">Estructura selectiva simple (Si… entonces)</text>

  <!-- START -->
  <ellipse class="terminator" cx="380" cy="120" rx="110" ry="35"/>
  <text x="380" y="125" text-anchor="middle" class="label">INICIO</text>

  <line class="arrow" x1="380" y1="155" x2="380" y2="205"/>

  <!-- Input A,B,C -->
  <polygon class="io" points="300,205 500,205 470,255 270,255"/>
  <text x="380" y="238" text-anchor="middle" class="label">A, B, C</text>

  <line class="arrow" x1="380" y1="255" x2="380" y2="320"/>

  <!-- Process: discriminant -->
  <rect class="process" x="240" y="320" width="280" height="70" rx="10" ry="10"/>
  <text x="380" y="362" text-anchor="middle" class="label">
    <tspan>DIS ← B</tspan><tspan baseline-shift="super" font-size="75%">2</tspan>
    <tspan> − 4·A·C</tspan>
  </text>

  <line class="arrow" x1="380" y1="390" x2="380" y2="450"/>

  <!-- Decision: DIS >= 0 ? -->
  <polygon class="decision" points="380,450 510,520 380,590 250,520"/>
  <text x="380" y="525" text-anchor="middle" class="label">¿DIS ≥ 0?</text>

  <!-- No branch to END (right) -->
  <line class="arrow" x1="510" y1="520" x2="770" y2="520"/>
  <text x="640" y="510" class="small">No</text>

  <!-- Yes branch down -->
  <line class="arrow" x1="380" y1="590" x2="380" y2="650"/>
  <text x="395" y="625" class="small">Sí</text>

  <!-- Process: compute roots -->
  <rect class="process" x="210" y="650" width="340" height="100" rx="10" ry="10"/>
  <text x="230" y="690" class="label">
    <tspan>X1 ← (−B + √DIS) / (2·A)</tspan>
  </text>
  <text x="230" y="715" class="label">
    <tspan>X2 ← (−B − √DIS) / (2·A)</tspan>
  </text>

  <!-- Output: Raices reales -->
  <line class="arrow" x1="380" y1="750" x2="380" y2="780" marker-end=""/>
  <!-- (We will connect to END via a side arrow for clarity) -->

  <!-- END terminator -->
  <ellipse class="terminator" cx="900" cy="520" rx="110" ry="35"/>
  <text x="900" y="525" text-anchor="middle" class="label">FIN</text>

  <!-- Arrow from roots box to END (rightwards then up) -->
  <path class="arrow" d="M 380 750 L 380 780 L 900 780 L 900 555"/>

  <!-- Output label near the long arrow -->
  <text x="660" y="770" class="small">"Raíces reales": X1, X2</text>

  <!-- Notes on the right -->
  <g>
    <rect x="640" y="205" width="420" height="56" class="note"/>
    <rect x="640" y="205" width="420" height="56" class="note-border"/>
    <text x="655" y="240" class="small">{Lectura de datos}</text>

    <rect x="640" y="320" width="420" height="70" class="note"/>
    <rect x="640" y="320" width="420" height="70" class="note-border"/>
    <text x="655" y="350" class="small">DIS = b² − 4ac (discriminante)</text>

    <rect x="640" y="600" width="420" height="110" class="note"/>
    <rect x="640" y="600" width="420" height="110" class="note-border"/>
    <text x="655" y="635" class="small">Si DIS ≥ 0 entonces existen raíces reales:</text>
    <text x="655" y="657" class="small">X1 = (−b + √DIS) / 2a, X2 = (−b − √DIS) / 2a</text>
    <text x="655" y="679" class="small">En otro caso, no hay raíces reales (flujo termina).</text>
  </g>

  <text x="40" y="780" class="small">Diagrama de Flujo 2.18</text>
</svg>
